apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        version: v1
    spec:
      containers:
      - name: gateway
        image: gateway:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4000"
        - name: INVENTARIOS_URL
          value: "http://inventarios-service:4001"
        - name: ORDENES_URL
          value: "http://ordenes-service:4002"
        - name: AWS_REGION
          value: "us-east-1"
        - name: SQS_ENDPOINT
          value: "https://sqs.us-east-1.amazonaws.com"
        - name: SNS_ENDPOINT
          value: "https://sns.us-east-1.amazonaws.com"
        # Secrets from Kubernetes Secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: aws-secret-access-key
        - name: SNS_TOPIC_ARN
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: sns-topic-arn
        - name: ORDER_CREATION_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: sqs-queue-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000
  type: LoadBalancer
