# Ordenes Server - Staging Multi-Server Deployment
version: '3.8'

services:
  ordenes:
    build:
      context: ./ordenes
      dockerfile: ../deployment/ordenes/Dockerfile
    container_name: ordenes-staging
    ports:
      - "4002:4002"
    env_file:
      - .env/staging/ordenes.env
    environment:
      - NODE_ENV=staging
      - SERVER_ROLE=ordenes
    networks:
      - staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ordenes-worker:
    build:
      context: ./ordenes
      dockerfile: ../deployment/ordenes/Dockerfile
    container_name: ordenes-worker-staging
    env_file:
      - .env/staging/ordenes.env
    environment:
      - NODE_ENV=staging
      - SERVER_ROLE=worker
    command: node worker.js
    depends_on:
      - ordenes
    networks:
      - staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "worker.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database connection retry service
  db-connector:
    image: postgres:15-alpine
    container_name: db-connector-ordenes-staging
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    command: >
      sh -c "
        echo 'Waiting for database connection...'
        until pg_isready -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USER}; do
          echo 'Database is unavailable - sleeping'
          sleep 2
        done
        echo 'Database is up - executing command'
        exit 0
      "
    networks:
      - staging-network
    restart: "no"

networks:
  staging-network:
    driver: bridge
    external: true
