services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    depends_on:
      - inventarios
      - ordenes
    volumes:
      - ./gateway:/app
      - /app/node_modules
    networks:
      - backend

  inventarios:
    build:
      context: ./inventarios
      dockerfile: Dockerfile.dev
    ports:
      - "4001:4001"
    volumes:
      - ./inventarios:/app
      - /app/node_modules
    networks:
      - backend

  ordenes:
    build:
      context: ./ordenes
      dockerfile: Dockerfile.dev
    ports:
      - "4002:4002"
    depends_on:
      - inventarios
    volumes:
      - ./ordenes:/app
      - /app/node_modules
    networks:
      - backend

networks:
  backend:
    driver: bridge
